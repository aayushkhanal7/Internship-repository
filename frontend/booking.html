<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Vehicle - VRP</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <nav>

        <h2>VRP</h2>

        <div>

            <a href="index.html">Home</a>

            <a href="vehicles.html">Vehicles</a>

            <a href="login.html">Login</a>

        </div>

    </nav>


    <section class="booking">

        <h1>Book Vehicle</h1>


        <div id="selected-vehicle">

            <p>Loading vehicle...</p>

        </div>


        <form id="booking-form">

            <label for="start-date">
                Start Date
            </label>

            <input
                type="date"
                id="start-date"
                required
            >


            <label for="end-date">
                End Date
            </label>

            <input
                type="date"
                id="end-date"
                required
            >


            <button type="submit">
                Book Vehicle
            </button>

        </form>


        <p id="booking-message"></p>

    </section>


    <script src="js/app.js"></script>

</body>

</html>
